name: Update MOS templates

on:
  schedule:
    # Daily at 03:15 UTC - fetch every upstream repository plus the curated
    # Community Applications apps, convert any new or changed templates into the
    # flat MOS Hub layout and commit the result.
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    # Pin an explicit Ubuntu image instead of the moving `ubuntu-latest` label,
    # which GitHub is migrating from Ubuntu 24.04 to Ubuntu 26.04 during
    # October-November 2026. See actions/runner-images#14748.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Convert upstream templates to MOS
        # The converter shallow-clones every SOURCES entry from scratch and
        # downloads the Community Applications feed (applicationFeed-raw.json),
        # so it always sees the latest upstream state. Only the apps in FEED_APPS
        # are taken from that feed, and those whose container image is already
        # published by one of the git collections are dropped, so the run stays
        # idempotent; when nothing changed upstream the generated tree is
        # byte-identical and the commit step below skips.
        run: python3 tools/convert_sources.py /tmp/unraid-sources . --mos-paths --mos-defaults

      - name: Validate the converted repository
        # Fails the run on any problem (missing fields, duplicate names, unknown
        # categories, unRAID leftovers, ...) so a broken conversion is never pushed.
        run: python3 tools/validate_repos.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes - nothing to commit."
          else
            git commit -m "Refresh MOS templates $(date +%Y-%m-%d)"
            git push
          fi
